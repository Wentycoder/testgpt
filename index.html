<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormaZone | Futbol Formaları</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">FORMA<span>ZONE</span></div>
        <nav>
            <a href="#">Ana Sayfa</a>
            <a href="#products">Formalar</a>
            <a href="#about">Hakkımızda</a>
        </nav>
        <button class="cart" onclick="showCart()">Sepetim (<span id="cart-count">0</span>)</button>
    </header>

    <section class="hero">
        <div>
            <p class="eyebrow">YENİ SEZON KOLEKSİYONU</p>
            <h1>Futbolun ruhunu<br>üzerinde taşı.</h1>
            <p>Favori takımlarının formalarını keşfet.</p>
            <a href="#products" class="hero-button">Formaları keşfet</a>
        </div>
    </section>

    <main id="products">
        <div class="section-heading">
            <div>
                <p class="eyebrow">KOLEKSİYONUMUZ</p>
                <h2>Popüler Formalar</h2>
            </div>
            <span>2026 / 2027</span>
        </div>
        <div class="products" id="product-list"></div>
    </main>

    <footer id="about">
        <div class="logo">FORMA<span>ZONE</span></div>
        <p>Futbol tutkunları için forma mağazası.</p>
        <small>© 2026 FormaZone. Tüm hakları saklıdır.</small>
    </footer>

    <script src="script.js"></script>
</body>
</html>
